name: Build Kaal Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Clean up Kotlin DSL files to prevent conflicts
      run: |
        rm -f build.gradle.kts
        rm -f settings.gradle.kts
        rm -f app/build.gradle.kts

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: KaalPlayer-Release-APK
        path: app/build/outputs/apk/release/*.apk